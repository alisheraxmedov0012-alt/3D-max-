<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchViz AI Assistant — Professional</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="ui">
        <h2>Uy/xona generator (Professional)</h2>
        <input type="text" id="prompt-input" placeholder="Masalan: uch xonali uy, oshxona, derazalar, eshik, garaj" />
        <button id="generate-btn">Yaratish</button>
        <button id="random-btn">🎲 Tasodifiy uy</button>
        <button id="download-btn">💾 Yuklab olish (GLB)</button>
        <button id="edit-mode-btn">✏️ Tahrir rejimi</button>
        <button id="save-btn">🔒 Saqlash</button>
        <button id="load-btn">📂 Yuklash</button>

        <!-- Rang palitrasi -->
        <div id="color-palette">
            <label>Devor: <input type="color" id="wall-color" value="#cccccc"></label>
            <label>Pol: <input type="color" id="floor-color" value="#8a5a2b"></label>
            <label>Tom: <input type="color" id="roof-color" value="#aa5555"></label>
        </div>

        <!-- Prompt misollari -->
        <div id="prompt-examples">
            <button class="example-btn" data-prompt="1 xonali uy, divan, stol, deraza, oq devor">1 xonali uy</button>
            <button class="example-btn" data-prompt="2 qavatli uy, mehmonxona, oshxona, yotoqxona, garaj, tom, maysa">2 qavatli uy</button>
            <button class="example-btn" data-prompt="zamonaviy ofis, stol, kreslo, shkaf, katta derazalar, marmar pol">Ofis</button>
            <button class="example-btn" data-prompt="hammom, dush, unitaz, rakovina, oq devor, kulrang pol">Hammom</button>
        </div>

        <!-- Statistika paneli -->
        <div id="stats">
            <strong>Statistika:</strong>
            <div id="stats-content">Hali loyiha yaratilmagan.</div>
        </div>

        <p><small>
            Promptda xona turlari, mebellar, ranglar, o'lchamlar va yoritishni ko'rsating.
            Rang palitrasi orqali devor/pol/tom rangini belgilang.
        </small></p>
    </div>
    <div id="canvas-container"></div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
